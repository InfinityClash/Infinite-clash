<style>
#IC_MAIN{
  width:100%;
  max-width:900px;
  margin:auto;
  color:#eee;
  font-family:Arial,Helvetica,sans-serif;
}

.ic-panel{
  background:linear-gradient(145deg,#10131b,#080a10);
  border:1px solid #303747;
  border-radius:14px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 8px 30px rgba(0,0,0,.35);
}

.ic-title{
  text-align:center;
  font-size:32px;
  font-weight:900;
  letter-spacing:3px;
  margin-bottom:5px;
}

.ic-subtitle{
  text-align:center;
  color:#8994a8;
  font-size:13px;
  letter-spacing:2px;
  margin-bottom:20px;
}

.ic-section-title{
  font-size:16px;
  font-weight:800;
  letter-spacing:1px;
  margin-bottom:12px;
  color:#dbe3f5;
}

.ic-mode-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.ic-mode{
  border:1px solid #343d50;
  background:#0d1119;
  border-radius:12px;
  padding:16px 10px;
  text-align:center;
  cursor:pointer;
  transition:.2s;
}

.ic-mode:hover{
  border-color:#7182a8;
  transform:translateY(-2px);
}

.ic-mode.selected{
  border-color:#d8a83e;
  box-shadow:0 0 18px rgba(216,168,62,.18);
  background:#17140d;
}

.ic-mode-name{
  font-size:21px;
  font-weight:900;
}

.ic-mode-info{
  color:#8994a8;
  font-size:11px;
  margin-top:5px;
}

.ic-button{
  width:100%;
  border:1px solid #414b60;
  background:#151a24;
  color:#fff;
  border-radius:9px;
  padding:12px;
  font-weight:800;
  cursor:pointer;
  margin-top:10px;
}

.ic-button:hover{
  background:#202737;
}

.ic-button.gold{
  border-color:#b88b32;
  background:linear-gradient(135deg,#6e511b,#9d7426);
}

.ic-button.red{
  border-color:#873d46;
  background:#35171c;
}

.ic-button:disabled{
  opacity:.45;
  cursor:not-allowed;
}

.ic-team{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.ic-team.three{
  grid-template-columns:repeat(3,1fr);
}

.ic-team.four{
  grid-template-columns:repeat(4,1fr);
}

.ic-fighter{
  position:relative;
  border:1px solid #303747;
  border-radius:11px;
  padding:13px 10px;
  background:#0d1118;
  min-height:80px;
}

.ic-fighter-name{
  font-weight:800;
  font-size:14px;
  padding-right:45px;
}

.ic-fighter-role{
  display:inline-block;
  margin-top:7px;
  font-size:9px;
  padding:3px 6px;
  border-radius:5px;
  background:#242b38;
  color:#aeb8cc;
}

.ic-change{
  position:absolute;
  right:7px;
  top:7px;
  border:1px solid #48536a;
  background:#171d28;
  color:#fff;
  border-radius:6px;
  font-size:9px;
  padding:5px 6px;
  cursor:pointer;
}

.ic-change:hover{
  background:#252d3d;
}

.ic-change.used{
  opacity:.3;
  cursor:not-allowed;
}

.ic-captain{
  border:1px solid #b58a35;
  background:linear-gradient(145deg,#211a0c,#120f09);
  box-shadow:0 0 20px rgba(181,138,53,.12);
}

.ic-captain-name{
  font-weight:900;
  color:#e3b84f;
}

.ic-captain-effect{
  color:#aaa;
  font-size:11px;
  margin-top:4px;
}

.ic-status{
  text-align:center;
  padding:14px;
  color:#9da8bb;
  font-size:12px;
}

.ic-error{
  color:#ff7d88;
  background:#291319;
  border:1px solid #68303a;
  border-radius:10px;
  padding:12px;
  margin-top:12px;
  font-size:12px;
}

#IC_BATTLE{
  white-space:normal;
  line-height:1.65;
}

.ic-chapter{
  text-align:center;
  margin:28px 0 15px;
  padding:10px 0;
  color:#e1b64d;
  font-size:18px;
  font-weight:900;
  letter-spacing:2px;
  border-top:1px solid #41351d;
  border-bottom:1px solid #41351d;
}

.ic-battle-line{
  margin:7px 0;
}

.ic-battle-line.dialogue{
  color:#d6dcef;
}

.ic-battle-line.action{
  color:#f0f0f0;
}

.ic-battle-line.system{
  color:#d5aa49;
  font-weight:800;
}

@media(max-width:650px){
  .ic-mode-grid{
    grid-template-columns:1fr;
  }

  .ic-team,
  .ic-team.three,
  .ic-team.four{
    grid-template-columns:1fr;
  }
}
</style>

window.IC_SHUFFLE = function(arr){

  const a=[...arr];

  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }

  return a;
};

        ? `

            ${used?"disabled":""}

/* =========================================================
   ONE CHANGE PER SLOT
   ========================================================= */

window.IC_CHANGE_FIGHTER = function(team,index){

  if(window.IC_STATE.busy) return;

  const arr=team==="A"
    ? window.IC_STATE.teamA
    : window.IC_STATE.teamB;

  const old=arr[index];

  const slotKey=team+":"+index;

  /*
    The restriction belongs to the selected slot,
    NOT to the fighter occupying that slot.
  */
  if(window.IC_STATE.changesUsed[slotKey]) return;

  const forbidden=[
    ...window.IC_STATE.teamA,
    ...window.IC_STATE.teamB
  ];

  const oldIndex=forbidden.indexOf(old);

  if(oldIndex!==-1)
    forbidden.splice(oldIndex,1);

  const pool=window.IC_POOL().filter(x=>!forbidden.includes(x));

  if(!pool.length) return;

  let replacement=window.IC_RANDOM(pool);

  let safety=0;

  while(replacement===old && safety<50){
    replacement=window.IC_RANDOM(pool);
    safety++;
  }

  arr[index]=replacement;

  /*
    Only this slot is now used.

    The old fighter and replacement fighter remain
    completely normal roster members.
  */
  window.IC_STATE.changesUsed[slotKey]=true;

  if(team==="A")
    window.IC_BUILD_TEAM_A();
  else
    window.IC_BUILD_TEAM_B();

};

window.IC_AI_CHOOSE_TEAM_B = async function(){

  const size=window.IC_MODE_SIZE();

  const available=
    window.IC_FIGHTERS.filter(
      fighter=>!window.IC_STATE.teamA.includes(fighter)
    );

  const prompt=`

You are selecting the opposing team for INFINITE CLASH.

This is NOT the battle itself.

You are the autonomous opposing-team strategist.

The human spectator has already received Team A:

${window.IC_STATE.teamA.map((x,i)=>
  `${i+1}. ${x} — ${window.IC_ROLE(x)}`
).join("\n")}

The opposing team must contain exactly ${size} fighters.

Choose the opposing team yourself from the available Infinite Clash roster below.

AVAILABLE FIGHTERS:
${available.map((x,i)=>
  `${i+1}. ${x} — ${window.IC_ROLE(x)}`
).join("\n")}

TEAM SELECTION RULES:

1. Select exactly ${size} DIFFERENT fighters.

2. NEVER select anyone from Team A.

3. You are the opposing AI.

4. Do NOT ask the user to choose.

5. Do NOT simply take the first fighters in the list.

6. Make a strategic team based on:
   - compatibility
   - teamwork
   - complementary abilities
   - battlefield roles
   - counters
   - tactical versatility
   - ability combinations
   - likely matchup against Team A
   - established personalities where relevant

7. Do not assume that the highest-ranked fighters automatically make the best team.

8. Do not create abilities or information that the fighters do not possess.

9. SUPPORT fighters are allowed.

10. HYBRID fighters are allowed.

11. COMBAT fighters are allowed.

12. The opposing team should feel like a deliberate AI strategic selection rather than a random roll.

OUTPUT ONLY A JSON ARRAY.

Example:
["Fighter A","Fighter B"]

No explanation.
No markdown.
No code fence.
Only the JSON array.

`;


  const result=
    await tavo.generate(
      prompt,
      {
        context:false,
        timeout:180000
      }
    );

  const raw=
    typeof result==="string"
      ? result
      : (result?.text || result?.content || "");

  if(!raw)
    throw new Error(
      "The opposing AI returned no team."
    );

  let parsed;

  try{

    const cleaned=String(raw)
      .replace(/```json/gi,"")
      .replace(/```/g,"")
      .trim();

    parsed=JSON.parse(cleaned);

  }catch(error){

    /*
      Try to recover a JSON array if the model
      included a small amount of extra text.
    */

    const match=String(raw).match(/\[[\s\S]*\]/);

    if(match){

      try{
        parsed=JSON.parse(match[0]);
      }catch(e){
        parsed=null;
      }

    }

  }

  if(!Array.isArray(parsed))
    throw new Error(
      "The opposing AI did not return a valid team."
    );

  /*
    Validate that every selected fighter actually exists
    in the roster and is not already on Team A.
  */

  const validRoster=new Set(window.IC_FIGHTERS);

  const team=[];

  for(const fighter of parsed){

    if(typeof fighter!=="string")
      continue;

    if(!validRoster.has(fighter))
      continue;

    if(window.IC_STATE.teamA.includes(fighter))
      continue;

    if(team.includes(fighter))
      continue;

    team.push(fighter);

  }

  if(team.length!==size){

    throw new Error(
      "The opposing AI selected an invalid team. "+
      "Expected "+size+" unique fighters but received "+team.length+"."
    );

  }

  return team;

};

window.IC_FIND_DATABASE = async function(){

  const exact=await tavo.lorebook.find(
    "Infinite Clash — Fighter Database",
    {match:"exact"}
  );

  if(exact && exact.length)
    return exact[0];

  const candidates=await tavo.lorebook.find(
    "Infinite Clash",
    {match:"contains"}
  );

  if(!candidates || !candidates.length)
    return null;

  const preferred=candidates.find(x=>
    x.name==="Infinite Clash — Fighter Database"
  );

  return preferred || candidates[0];

};


/* =========================================================
   FIND PARTICIPANT ENTRY
   ========================================================= */

window.IC_FIND_ENTRY = function(entries,name){

  if(!entries || !entries.length)
    return null;

  const normalize=s=>
    String(s||"")
      .toLowerCase()
      .replace(/ō/g,"o")
      .replace(/ū/g,"u")
      .replace(/ā/g,"a")
      .replace(/ī/g,"i")
      .replace(/ē/g,"e")
      .replace(/ô/g,"o")
      .replace(/’/g,"'")
      .replace(/[^a-z0-9]/g,"");

  const target=normalize(name);

  let entry=entries.find(e=>{
    const n=normalize(e.name);
    return n===target;
  });

  if(entry) return entry;

  entry=entries.find(e=>{

    const n=normalize(e.name||"");

    return n.includes(target) || target.includes(n);

  });

  if(entry) return entry;

  entry=entries.find(e=>{

    const keys=[
      ...(Array.isArray(e.keys)?e.keys:[]),
      ...(Array.isArray(e.secondaryKeys)?e.secondaryKeys:[])
    ].map(normalize);

    return keys.includes(target);

  });

  if(entry) return entry;

  entry=entries.find(e=>{

    const content=normalize(e.content||"");

    return content.includes(target);

  });

  return entry || null;

};


/* =========================================================
   LOAD ONLY PARTICIPANT PROFILES
   ========================================================= */

window.IC_LOAD_PARTICIPANT_PROFILES = async function(){

  const database=await window.IC_FIND_DATABASE();

  if(!database)
    throw new Error(
      "Infinite Clash — Fighter Database was not found."
    );

  const full=await tavo.lorebook.get(database.id);

  if(!full || !Array.isArray(full.entries))
    throw new Error(
      "The Infinite Clash Fighter Database could not be read."
    );

  const participants=[
    ...window.IC_STATE.teamA,
    ...window.IC_STATE.teamB
  ];

  const profiles=[];
  const missing=[];

  for(const fighter of participants){

    const entry=window.IC_FIND_ENTRY(
      full.entries,
      fighter
    );

    if(!entry){

      missing.push(fighter);
      continue;

    }

    profiles.push({

      fighter:fighter,

      name:entry.name || fighter,

      content:entry.content || "",

      keys:Array.isArray(entry.keys)
        ? entry.keys
        : [],

      secondaryKeys:Array.isArray(entry.secondaryKeys)
        ? entry.secondaryKeys
        : []

    });

  }

  if(missing.length){

    throw new Error(
      "Lorebook verification failed for: "+
      missing.join(", ")
    );

  }

  return profiles;

};

/* =========================================================
   BATTLE CLEANUP
   ========================================================= */

window.IC_CLEAN_BATTLE = function(text){

  if(!text)
    return "";

  let t=String(text);

  t=t.replace(/```(?:html|markdown|text)?/gi,"");
  t=t.replace(/```/g,"");

  t=t.replace(
    /^\s*(?:Battle Complete|Simulation Complete|What happens next\?|Choose what happens next).*$/gim,
    ""
  );

  return t.trim();

};


/* =========================================================
   CINEMATIC RENDER
   ========================================================= */

window.IC_RENDER_BATTLE = function(text){

  const root=document.getElementById("IC_BATTLE");

  const clean=window.IC_CLEAN_BATTLE(text);

  const lines=clean
    .split(/\n+/)
    .map(x=>x.trim())
    .filter(Boolean);

  let html=`
    <div class="ic-panel">
      <div class="ic-title">INFINITE CLASH</div>
      <div class="ic-subtitle">
        ${window.IC_STATE.mode.toUpperCase()} · SIMULTANEOUS TEAM BATTLE
      </div>
    </div>

    <div class="ic-panel">
  `;

  for(const line of lines){

    const isTitle=
      /^[A-Z0-9][A-Z0-9 '"’—:!?.,-]{5,80}$/.test(line) &&
      line.length<90;

    if(isTitle){

      html+=`
        <div class="ic-chapter">
          ${window.IC_ESCAPE(line)}
        </div>
      `;

    }else{

      let cls="ic-battle-line";

      if(/^["“].*["”]$/.test(line))
        cls+=" dialogue";

      if(/^\*/.test(line))
        cls+=" action";

      html+=`
        <div class="${cls}">
          ${window.IC_ESCAPE(line)}
        </div>
      `;

    }

  }

  html+=`</div>`;

  root.innerHTML=html;

};


/* =========================================================
   START BATTLE
   ========================================================= */

window.IC_START_BATTLE = async function(){

  if(window.IC_STATE.busy)
    return;

  window.IC_STATE.busy=true;

  const selector=document.getElementById("IC_SELECTOR");
  const battle=document.getElementById("IC_BATTLE");

  selector.innerHTML=`
    <div class="ic-status">
      ⚔ VERIFYING PARTICIPANTS AGAINST THE LOREBOOK...
    </div>
  `;

  battle.innerHTML="";

  try{

    /*
      IMPORTANT:

      We retrieve the central Infinite Clash database,
      extract ONLY the selected fighters,
      and inject ONLY those profiles into tavo.generate.

      We intentionally do NOT activate the complete Lorebook
      during generation because that would inject the entire
      fighter database and create enormous context usage.
    */

    const profiles=
      await window.IC_LOAD_PARTICIPANT_PROFILES();

    selector.innerHTML=`
      <div class="ic-status">
        ✓ ALL ${profiles.length} PARTICIPANTS VERIFIED<br>
        Loading battle...
      </div>
    `;

    const prompt=
      window.IC_BUILD_BATTLE_PROMPT(profiles);

    const result=
      await tavo.generate(
        prompt,
        {
          context:false,
          timeout:180000
        }
      );

    const battleText=
      typeof result==="string"
        ? result
        : (result?.text || result?.content || "");

    if(!battleText)
      throw new Error(
        "The battle generator returned no text."
      );

    const clean=
      window.IC_CLEAN_BATTLE(battleText);

    /*
      IMPORTANT:

      Do NOT append the generated battle as a normal
      assistant message.

      IC_RENDER_BATTLE is the ONLY visible presentation.
      Appending the same text to the chat would create
      a duplicate copy of the battle.
    */

    window.IC_RENDER_BATTLE(clean);

    selector.innerHTML=`
      <div class="ic-status">
        ✓ BATTLE COMPLETE
      </div>
    `;

  }catch(error){

    console.error("Infinite Clash error:",error);

    const message=
      error?.message ||
      String(error);

    selector.innerHTML=`
      <div class="ic-error">
        ⚠️ BATTLE BLOCKED<br><br>
        ${window.IC_ESCAPE(message)}
      </div>

      <button class="ic-button red"
        onclick="window.IC_RESET()">
        RETURN TO BATTLE SETUP
      </button>
    `;

  }finally{

    window.IC_STATE.busy=false;

  }

};

window.IC_RESET = function(){

  if(window.IC_STATE.busy)
    return;

  window.IC_STATE={
    mode:null,
    teamA:[],
    teamB:[],
    captainA:null,
    captainB:null,
    changesUsed:{},
    screen:"mode",
    busy:false
  };

  document.getElementById("IC_BATTLE").innerHTML="";

  window.IC_SHOW_MODES();

};
